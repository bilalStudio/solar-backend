# ════════════════════════════════════════════════════
#  WattVue Solar Backend - Configuration
# ════════════════════════════════════════════════════

# ─── Server ───
server.port=${PORT:8080}

# ─── PostgreSQL Database ───
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.owjcaxgqfmmqapuqxuwz}
spring.datasource.password=${DB_PASSWORD:Chhapie420$}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Connection Pool (prevents Supabase max connections error) ───
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ─── JWT ───
jwt.secret=${JWT_SECRET:WattVueSolarPlatformSecretKey2024VeryLongAndSecureStringForJWTSigning}
jwt.expiration=86400000

# ─── File Upload ───
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Email via Resend.com HTTP API ───
# SMTP is blocked on Railway — using Resend API (HTTPS port 443) instead
# Get free API key at https://resend.com
app.brevo.api-key=${BREVO_API_KEY:}
app.resend.api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
app.mail.from-name=${MAIL_FROM_NAME:WattVue Solar}

# ─── Keep spring.mail config minimal (needed for bean wiring) ───
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# ─── Google OAuth ───
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# ─── Frontend URL (for password reset links) ───
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ─── CORS ───
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,https://solar-frontend-rust.vercel.app}

# ─── App ───
spring.application.name=solar-backend
logging.level.com.wattvue=INFO
logging.level.org.springframework.security=INFO