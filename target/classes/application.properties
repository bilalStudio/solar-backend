# ════════════════════════════════════════════════════
#  WattVue Solar Backend - Configuration
# ════════════════════════════════════════════════════

# ─── Server ───
server.port=${PORT:8080}

# ─── PostgreSQL Database ───
# Override DB_URL, DB_USERNAME, DB_PASSWORD via environment variables in production
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.owjcaxgqfmmqapuqxuwz}
spring.datasource.password=${DB_PASSWORD:Chhapie420$}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ─── JWT ───
jwt.secret=${JWT_SECRET:WattVueSolarPlatformSecretKey2024VeryLongAndSecureStringForJWTSigning}
jwt.expiration=86400000

# ─── File Upload ───
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Email (Gmail SMTP) ───
# To enable: set MAIL_USERNAME and MAIL_PASSWORD env vars
# For Gmail, create an "App Password" at https://myaccount.google.com/apppasswords
app.mail.transport=${MAIL_TRANSPORT:nodemailer}
app.mail.nodemailer.script=${NODEMAILER_SCRIPT:mailer/send-mail.js}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@wattvue.com}
app.mail.from-name=WattVue Solar

# ─── Google OAuth ───
# Get a client ID at https://console.cloud.google.com/apis/credentials
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# ─── Frontend URL (for password reset links) ───
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ─── CORS ───
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,https://solar-roi-frontend-beryl.vercel.app}

# ─── App ───
spring.application.name=solar-backend
logging.level.com.wattvue=INFO
logging.level.org.springframework.security=INFO
